<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - My Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='y2k.css') }}?v=4"
>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.25);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
        }

        .edit-card {
            max-width: 720px;
            margin: auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            background: var(--card-bg);
        }

        .image-editor {
    width: 100%;
    height: 500px;
    overflow: hidden;
    border-radius: 12px;
    background: #e2e8f0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.image-editor .item-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: 50% 50%;
    border-radius: 12px;
    user-select: none;
    -webkit-user-drag: none;
    cursor: grab;
    transform: scale(1);
    transform-origin: center center;
}

.image-editor .item-image:active {
    cursor: grabbing;
}

.zoom-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.zoom-controls input {
    flex: 1;
}
        .form-section {
            margin-bottom: 1.25rem;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 0.65rem 0.8rem;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
        }

        .btn-primary-custom:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #fff;
        }


.image-editor {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
}

.image-editor .item-image {
    cursor: grab;
    user-select: none;
}

    </style>
</head>

    <div class="container">
        <a class="navbar-brand" href="/">
        </a>

        <a href="/" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Inventory
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="card edit-card">
        <div class="card-body p-4">

            <h2 class="mb-4 fw-bold">
                Edit Item
            </h2>

{% if item['image_path'] %}
<div class="image-editor mb-4">
    <img
        id="editImagePreview"
        src="{{ url_for('static', filename='uploads/' ~ item['image_path']) }}"
        class="item-image"
        alt="{{ item['name'] }}"
        draggable="false">
</div>
{% else %}
<div class="image-editor mb-4">
    <div
        id="editImagePreview"
        class="item-image d-flex align-items-center justify-content-center text-muted">

            <option value="Handbag" {% if item['category'] == 'Handbag' %}selected{% endif %}>Handbag</option>

<script>

const customSize = document.getElementById("customSize");

sizeSelect.addEventListener("change", function () {
    if (this.value === "OTHER") {
        customSize.style.display = "block";
        customSize.focus();
    } else {
        customSize.style.display = "none";
        customSize.value = "";
    }
});




</script>
<script>
const categorySelect = document.getElementById("categorySelect");
const customCategory = document.getElementById("customCategory");

if (categorySelect && customCategory) {

    categorySelect.addEventListener("change", function () {

        if (this.value === "OTHER") {
            customCategory.style.display = "block";
            customCategory.required = true;
            customCategory.focus();
        } else {
            customCategory.style.display = "none";
            customCategory.required = false;
            customCategory.value = "";
        }

    });

    // If the existing item already has a custom category,
    // show it when opening the edit page.
    const standardCategories = [
        "Dresses",
        "Jackets",
        "Tops",
        "Shirts",
        "Pants",
        "Jeans",
        "Skirts",
        "Shorts",
        "Hoodies",
        "Sweaters",
        "Abayas",
        "Sneakers",
        "Boots",
        "Sandals",
        "Heels",
        "Flats",
        "Shoes",
        "Bags",
        "Handbag",
        "Backpack",
        "Jewelry",
        "Belts",
        "Scarves",
        "Hats",
        "Sunglasses",
        "Books",
        "Beauty",
        "Electronics",
        "Home Decor"
    ];

    const currentCategory = "{{ item['category'] or '' }}";

    if (
        currentCategory !== "" &&
        !standardCategories.includes(currentCategory)
    ) {
        categorySelect.value = "OTHER";
        customCategory.value = currentCategory;
        customCategory.style.display = "block";
        customCategory.required = true;
    }
}
</script>

<script>

const editImageInput = document.getElementById("editImageInput");
const editImagePreview = document.getElementById("editImagePreview");
const imagePosition = document.getElementById("imagePosition");
const zoomSlider = document.getElementById("zoomSlider");
const imageZoom = document.getElementById("imageZoom");
const resetImage = document.getElementById("resetImage");

if (
    editImageInput &&
    editImagePreview &&
    imagePosition &&
    zoomSlider &&
    imageZoom
) {

    let isDragging = false;
    let startX = 0;
    let startY = 0;

    // -------------------------
    // Apply saved settings
    // -------------------------

    function applyImageSettings() {

        if (editImagePreview.tagName !== "IMG") {
            return;
        }

        const zoom = parseFloat(imageZoom.value) || 1;

        editImagePreview.style.objectPosition =
            imagePosition.value || "50% 50%";

        editImagePreview.style.transform =
            `scale(${zoom})`;
    }

    applyImageSettings();


    // -------------------------
    // Zoom slider
    // -------------------------

    zoomSlider.addEventListener("input", function () {

        const zoom = parseFloat(this.value);

        imageZoom.value = zoom;

        applyImageSettings();

    });


    // -------------------------
    // New image selected
    // -------------------------

    editImageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            if (editImagePreview.tagName === "IMG") {

                editImagePreview.src = event.target.result;

            } else {

                const img = document.createElement("img");

                img.id = "editImagePreview";
                img.className = "item-image";
                img.alt = "Preview";
                img.draggable = false;

                editImagePreview.parentElement.replaceChild(
                    img,
                    editImagePreview
                );

            }

            const newPreview =
                document.getElementById("editImagePreview");

            newPreview.src = event.target.result;

            imagePosition.value = "50% 50%";

            imageZoom.value = "1";

            zoomSlider.value = "1";

            newPreview.style.objectPosition = "50% 50%";
            newPreview.style.transform = "scale(1)";

        };

        reader.readAsDataURL(file);

    });


    // -------------------------
    // Drag image
    // -------------------------

    editImagePreview.addEventListener("mousedown", function (event) {

        if (editImagePreview.tagName !== "IMG") {
            return;
        }

        isDragging = true;

        startX = event.clientX;
        startY = event.clientY;

        editImagePreview.style.cursor = "grabbing";

        event.preventDefault();

    });


    document.addEventListener("mousemove", function (event) {

        if (!isDragging) {
            return;
        }

        const moveX = event.clientX - startX;
        const moveY = event.clientY - startY;

        let parts =
            (imagePosition.value || "50% 50%").split(" ");

        let x = parseFloat(parts[0]) || 50;
        let y = parseFloat(parts[1]) || 50;

        x += moveX * 0.25;
        y += moveY * 0.25;

        x = Math.max(0, Math.min(100, x));
        y = Math.max(0, Math.min(100, y));

        const newPosition =
            `${x}% ${y}%`;

        imagePosition.value = newPosition;

        editImagePreview.style.objectPosition =
            newPosition;

        startX = event.clientX;
        startY = event.clientY;

    });


    document.addEventListener("mouseup", function () {

        if (isDragging) {

            isDragging = false;

            editImagePreview.style.cursor = "grab";

        }

    });


    // -------------------------
    // Reset
    // -------------------------

    if (resetImage) {

        resetImage.addEventListener("click", function () {

            imagePosition.value = "50% 50%";

            imageZoom.value = "1";

            zoomSlider.value = "1";

            applyImageSettings();

        });

    }

}

</script>

</html>
